name: Call Auto-Close Detector

# ========================================
# 【本番環境用ファイル】
# このファイルは task_management_app リポジトリの本番環境用です。
# ユーザーに配布する際は github-actions-template/ フォルダのファイルを使用してください。
# ========================================
# このファイルは「呼び出し側」です。
# フィーチャーブランチでコミットすると、auto-close.yml（実体側）を呼び出してToDoの自動クローズ判定を実行します。
# ========================================

on:
  push:
    # main/masterブランチ以外で実行（フィーチャーブランチでのみ）
    branches-ignore:
      - main
      - master
    # 除外パターン: ドキュメントのみの変更は自動クローズ判定をスキップ
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'minutes/**'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID (optional)'
        required: false
        type: string
        default: ''
      ai_analysis_enabled:
        description: 'Enable AI analysis (Phase 2)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  call-auto-close:
    name: Auto-Close Todos (via Reusable Workflow)
    # [skip ci] を含むコミットはスキップ
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # NOTE: 同一リポジトリ内の実体ワークフローを呼び出します
    uses: ./.github/workflows/auto-close.yml
    with:
      # NOTE: 複数プロジェクトを管理する場合は、プロジェクトIDを指定してください（省略可）
      project_id: ${{ inputs.project_id || '' }}
      # Phase 2（ファイル名照合 + AI判定）を使用
      ai_analysis_enabled: ${{ inputs.ai_analysis_enabled || true }}
    secrets:
      # NOTE: 以下のシークレットがGitHubリポジトリのSettings > Secrets and variablesに登録されている必要があります
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
