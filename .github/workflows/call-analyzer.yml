name: Call Minutes Analyzer

# ========================================
# 【本番環境用ファイル】
# このファイルは task_management_app リポジトリの本番環境用です。
# ユーザーに配布する際は github-actions-template/ フォルダのファイルを使用してください。
# ========================================
# このファイルは「呼び出し側」です。
# minutes/ フォルダにWord(.docx)またはMarkdown(.md)ファイルをプッシュすると、
# analyzer.yml（実体側）を呼び出して議事録のAI解析を実行します。
# ========================================

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - 'minutes/**/*.docx'
      - 'minutes/**/*.md'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  call-analyzer:
    name: Analyze Minutes (via Reusable Workflow)
    # [skip ci] を含むコミットはスキップ（自動生成されたMarkdownファイルの再解析を防止）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # NOTE: 同一リポジトリ内の実体ワークフローを呼び出します
    uses: ./.github/workflows/analyzer.yml
    with:
      # NOTE: 議事録ファイルのパスパターン（必要に応じて変更）
      files_pattern: 'minutes/**/*.{docx,md}'
      # NOTE: 複数プロジェクトを管理する場合は、プロジェクトIDを指定してください（省略可）
      project_id: ${{ inputs.project_id || '' }}
      analyze_mode: 'auto'
    secrets:
      # NOTE: 以下のシークレットがGitHubリポジトリのSettings > Secrets and variablesに登録されている必要があります
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
